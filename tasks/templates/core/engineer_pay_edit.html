{% extends "base.html" %}
{% block content %}
<div class="max-w-lg mx-auto my-10">
    <div class="bg-white shadow rounded-lg p-8">
        <h1 class="text-2xl font-bold text-blue-800 mb-6">Pay settings — {{ engineer.username }}</h1>
        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Pay type</label>
                {{ form.pay_type }}
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Monthly salary (KES)</label>
                {{ form.monthly_salary }}
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Rate per task (KES)</label>
                {{ form.task_rate }}
                <p class="text-xs text-gray-500 mt-1">{{ form.task_rate.help_text }}</p>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Rate per hour (KES)</label>
                {{ form.hourly_rate }}
                <p class="text-xs text-gray-500 mt-1">{{ form.hourly_rate.help_text }}</p>
            </div>
            <div class="flex gap-3 pt-2">
                <button type="submit" class="bg-blue-800 text-white px-4 py-2 rounded hover:bg-blue-900 transition">Save</button>
                <a href="{% url 'engineer_detail' engineer.pk %}" class="bg-gray-200 text-gray-700 px-4 py-2 rounded hover:bg-gray-300 transition">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
