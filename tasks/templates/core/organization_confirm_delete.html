{% extends "base.html" %}
{% block content %}
<div class="max-w-lg mx-auto my-10">
    <div class="bg-white shadow rounded-lg p-8">
        <h2 class="text-2xl font-bold text-red-800 mb-6 text-center">Confirm Delete</h2>
        <p class="mb-6 text-gray-700 text-center">Are you sure you want to delete the organization: <span class="font-semibold">{{ organization.name }}</span>?</p>
        <form method="post">
            {% csrf_token %}
            <div class="flex justify-center space-x-4">
                <button type="submit" class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700 transition">Delete</button>
                <a href="{% url 'organization_detail' organization.pk %}" class="bg-gray-300 text-gray-700 px-4 py-2 rounded hover:bg-gray-400 transition">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
