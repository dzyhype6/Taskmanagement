{% extends "base.html" %}
{% block content %}
<div class="max-w-xl mx-auto my-10">
    <div class="bg-white shadow rounded-lg p-8">
        <h1 class="text-2xl font-bold text-blue-800 mb-4">{{ organization.name }}</h1>
        <p class="mb-2"><span class="font-semibold text-gray-700">Description:</span> {{ organization.description }}</p>
        <p class="mb-2"><span class="font-semibold text-gray-700">Created At:</span> {{ organization.created_at|date:"M d, Y" }}</p>
        <div class="mt-4 flex space-x-4">
            <a href="{% url 'organization_update' organization.pk %}" class="bg-yellow-600 text-white px-4 py-2 rounded hover:bg-yellow-700 transition">Edit</a>
            <a href="{% url 'organization_delete' organization.pk %}" class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700 transition">Delete</a>
        </div>
    </div>
</div>
{% endblock %}
